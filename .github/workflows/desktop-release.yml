name: Desktop CI and release

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const p=require('./package.json'); if (process.env.RELEASE_TAG !== 'v'+p.version) throw new Error('Release tag must be v'+p.version)"

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            artifact: task-sync-windows-x64
          - os: macos-15-intel
            arch: x64
            artifact: task-sync-macos-x64
          - os: macos-14
            arch: arm64
            artifact: task-sync-macos-arm64
          - os: ubuntu-latest
            arch: x64
            artifact: task-sync-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg xvfb
      - run: npm ci
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e
      - if: runner.os != 'Linux'
        run: npm run test:e2e
      - run: npm run make:desktop -- --arch=${{ matrix.arch }}
      - if: runner.os == 'macOS'
        run: npm run make:dmg -- ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop-out/make/**/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
      - name: Generate SHA-256 checksums
        run: |
          while IFS= read -r -d '' file; do
            checksum=$(sha256sum "$file")
            printf '%s  %s\n' "${checksum%% *}" "$(basename "$file")"
          done < <(find release-artifacts -type f -print0 | sort -z) > release-artifacts/SHA256SUMS.txt
      - name: Create release and upload unsigned installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --notes "Unsigned Task Sync desktop builds. Review the installation warnings in docs/DESKTOP.md."
          find release-artifacts -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
