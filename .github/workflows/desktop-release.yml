name: Desktop CI and release

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            artifact: task-sync-windows-x64
          - os: macos-15-intel
            arch: x64
            artifact: task-sync-macos-x64
          - os: macos-14
            arch: arm64
            artifact: task-sync-macos-arm64
          - os: ubuntu-latest
            arch: x64
            artifact: task-sync-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg xvfb
      - run: npm ci
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e
      - if: runner.os != 'Linux'
        run: npm run test:e2e
      - run: npm run make:desktop -- --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop-out/make/**/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create release and upload unsigned installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --notes "Unsigned Task Sync desktop builds. Review the installation warnings in docs/DESKTOP.md."
          find release-artifacts -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
